<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function greet(name) {
            return "hello " + name;
        }
        let a = greet("John")
        console.log(a);

        // -------------------------------------------------------------------------


        const evenodd = (num) => {
            if (num % 2 == 0) {
                return "even";
            } else {
                return "odd";

            }
        }
        let b = evenodd(20)
        console.log(b);

        // ------------------------------------------------------------------------

        const mul = (a, b) => {
            return "the value = ", a * b;
        }
        let c = mul(12, 7)
        console.log(c);


        // -------------------------------------------------------------------------


        (() => {
            console.log("IIFE executed");

        })()


        // -------------------------------------------------------------------------


        let sqr = function (a) {
            console.log(a * a);


        }
        sqr(5)

        // -------------------------------------------------------------------------

        const fun = (callback) => {
            return callback;
        }
        const newfun = (fun) => {
            console.log("This is inner function");

        }
        newfun()


        // -------------------------------------------------------------------------


        function add(a, b) {
            return a + b;
        }
        function sub(a, b) {
            return a - b;
        }
        const calculate = (num1, num2, callback) => {
            return callback(num1, num2)

        }
        console.log(calculate(20, 10, sub));
        // -------------------------------------------------------------------------

        const funA = (a = "num", b = "num") => {
            console.log("the value is : ", a, b);

        }
        funA()



        // -------------------------------------------------------------------------

        const num = [5, 10, 15, 20, 25];
        const mult = num.map((data) => {
            return data * 10
        })
        console.log(mult);


        //------------------------------------------------------------------------- 

        const student = [{ name: "Ali", marks: 35 },
        { name: "Sara", marks: 50 },
        { name: "Tom", marks: 80 },
        { name: "John", marks: 20 }];

        const upstudents = student.map((student) => {
            return student.name.toUpperCase();
        })
        console.log(upstudents);

        //-------------------------------------------------------------------------

        const result = student.map((student) => {
            return student.name + " has scored " + student.marks + " marks";

        })
        console.log(result);
        //-------------------------------------------------------------------------

        const score = student.map((student) => {
            return student.marks >= 40
        })
        console.log(score);
        //-------------------------------------------------------------------------
    </script>
</body>

</html>
